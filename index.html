<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morse Code Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s, color 0.3s;
    overflow: hidden;
  }

  /* ── Page flip container ── */
  .page-wrap {
    perspective: 1400px;
    width: 100vw;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-inner {
    width: 100%;
    min-height: 100vh;
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.4,0,.2,1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-inner.flipped { transform: rotateY(180deg); }

  .page-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    gap: 20px;
    background: var(--bg);
  }

  .page-back { transform: rotateY(180deg); }

  /* ── Flashcard view ── */
  h1 { font-size: 18px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
  .progress { font-size: 13px; color: var(--subtle); }

  .card-wrap {
    perspective: 800px;
    width: 280px;
    height: 180px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,0,.2,1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    border: 0.5px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.3s;
  }

  .front { background: var(--card-front); }
  .back  { background: var(--card-back); transform: rotateY(180deg); }

  .letter   { font-size: 64px; font-weight: 500; color: var(--text); line-height: 1; }
  .hint     { font-size: 13px; color: var(--subtle); }
  .mnemonic { font-size: 22px; font-weight: 500; color: var(--text); }

  .morse-row {
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 10px;
    flex-wrap: nowrap;
  }

  .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text);
    flex-shrink: 0;
  }

  .dash {
    display: inline-block;
    width: 26px; height: 10px;
    border-radius: 5px;
    background: var(--text);
    flex-shrink: 0;
  }

  /* smaller dot/dash for cheat sheet */
  .dot-sm {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text);
    flex-shrink: 0;
  }

  .dash-sm {
    display: inline-block;
    width: 16px; height: 6px;
    border-radius: 3px;
    background: var(--text);
    flex-shrink: 0;
  }

  .morse-row-sm {
    display: flex;
    align-items: center;
    gap: 3px;
    min-height: 6px;
    flex-wrap: nowrap;
  }

  /* ── Controls ── */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .btn-row  { display: flex; gap: 10px; justify-content: center; }

  button {
    border: 0.5px solid var(--border);
    background: transparent;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s, color 0.15s, border-color 0.3s;
  }

  button:hover  { background: var(--btn-hover); }
  button:active { transform: scale(0.98); }
  button.muted  { color: var(--subtle); }

  /* ── Pip row ── */
  .dots-row {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    width: 100%;
    max-width: 340px;
    justify-content: center;
    padding-bottom: 4px;
  }

  .pip {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }

  .pip:hover  { transform: scale(1.5); }
  .pip.active { background: var(--text); }

  /* ── Cheat sheet ── */
  .cheat-header {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .cheat-table {
    width: 100%;
    max-width: 360px;
    border-collapse: collapse;
    font-size: 13px;
  }

  .cheat-table thead th {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--subtle);
    padding: 0 8px 8px;
    text-align: left;
    border-bottom: 0.5px solid var(--border);
  }

  .cheat-table tbody tr {
    border-bottom: 0.5px solid var(--border);
  }

  .cheat-table tbody tr:last-child { border-bottom: none; }

  .cheat-table td {
    padding: 5px 8px;
    vertical-align: middle;
    color: var(--text);
  }

  .cheat-table td:first-child {
    font-size: 16px;
    font-weight: 600;
    width: 32px;
  }

  .cheat-table td:nth-child(2) {
    color: var(--subtle);
    font-size: 12px;
    width: 120px;
  }

  .section-divider td {
    padding-top: 10px;
    padding-bottom: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--subtle);
    border-bottom: 0.5px solid var(--border);
  }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-inner" id="page-inner">

    <!-- FRONT: Flashcard view -->
    <div class="page-face page-front">
      <h1>Morse code flashcards</h1>
      <div class="progress" id="progress">Card 1 of 36</div>

      <div class="card-wrap" onclick="flipCard()">
        <div class="card" id="card">
          <div class="face front">
            <div class="letter" id="letter">A</div>
            <div class="hint">tap to reveal</div>
          </div>
          <div class="face back">
            <div class="mnemonic" id="mnemonic">at</div>
            <div class="morse-row" id="morse-display"></div>
          </div>
        </div>
      </div>

      <div class="dots-row" id="dots-row"></div>

      <div class="controls">
        <div class="btn-row">
          <button onclick="prevCard()">&#8592; prev</button>
          <button onclick="nextCard()">next &#8594;</button>
        </div>
        <div class="btn-row">
          <button id="speed-btn" onclick="toggleSpeed()">speed: fast</button>
          <button id="sound-btn" onclick="toggleSound()">sound: on</button>
        </div>
        <div class="btn-row">
          <button onclick="shuffle()">shuffle</button>
          <button onclick="reset()">reset</button>
        </div>
        <div class="btn-row">
          <button id="dark-btn" onclick="toggleDark()">dark mode: off</button>
        </div>
        <div class="btn-row">
          <button onclick="toggleCheatSheet()">show cheat sheet</button>
        </div>
      </div>
    </div>

    <!-- BACK: Cheat sheet view -->
    <div class="page-face page-back">
      <div class="cheat-header">Cheat sheet</div>

      <div style="width:100%;max-width:360px;overflow-y:auto;max-height:70vh;">
        <table class="cheat-table" id="cheat-table"></table>
      </div>

      <div class="controls">
        <div class="btn-row">
          <button id="dark-btn-cs" onclick="toggleDark()">dark mode: off</button>
        </div>
        <div class="btn-row">
          <button onclick="toggleCheatSheet()">hide cheat sheet</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   CONFIGURABLE COLORS
   Edit these values to change the app's appearance.
   Each mode has its own set — light and dark.
   ============================================================ */
const COLORS = {
  light: {
    bg:         '#f5f5f3',   /* page background                  */
    text:       '#1a1a18',   /* primary text, dots, dashes, pips */
    subtle:     '#888780',   /* secondary text, hints, progress  */
    border:     '#c8c7bf',   /* card border, button border, pips */
    cardFront:  '#ffffff',   /* front face of card               */
    cardBack:   '#f0efea',   /* back face of card                */
    btnHover:   '#e8e7e2',   /* button hover background          */
  },
  dark: {
    bg:         '#1a1a18',   /* page background                  */
    text:       '#f0efea',   /* primary text, dots, dashes, pips */
    subtle:     '#888780',   /* secondary text, hints, progress  */
    border:     '#3a3a36',   /* card border, button border, pips */
    cardFront:  '#2a2a26',   /* front face of card               */
    cardBack:   '#222220',   /* back face of card                */
    btnHover:   '#2e2e2a',   /* button hover background          */
  },
};
/* ============================================================ */

let darkMode    = false;
let cheatOpen   = false;

function applyColors(mode) {
  const c = COLORS[mode];
  const r = document.documentElement.style;
  r.setProperty('--bg',         c.bg);
  r.setProperty('--text',       c.text);
  r.setProperty('--subtle',     c.subtle);
  r.setProperty('--border',     c.border);
  r.setProperty('--card-front', c.cardFront);
  r.setProperty('--card-back',  c.cardBack);
  r.setProperty('--btn-hover',  c.btnHover);
}

function toggleDark() {
  darkMode = !darkMode;
  applyColors(darkMode ? 'dark' : 'light');
  const label = `dark mode: ${darkMode ? 'on' : 'off'}`;
  document.getElementById('dark-btn').textContent    = label;
  document.getElementById('dark-btn-cs').textContent = label;
}

applyColors('light');

/* ============================================================
   DATA
   ============================================================ */
const data = [
  { letter:'A', mnemonic:'at',          morse:'.-'    },
  { letter:'B', mnemonic:'bean / beer', morse:'-...'  },
  { letter:'C', mnemonic:'Cate',        morse:'-.-.'  },
  { letter:'D', mnemonic:'Dan',         morse:'-..'   },
  { letter:'E', mnemonic:'e',           morse:'.'     },
  { letter:'F', mnemonic:'cafe',        morse:'..-.'  },
  { letter:'G', mnemonic:'gym',         morse:'--.'   },
  { letter:'H', mnemonic:'ears',        morse:'....'  },
  { letter:'I', mnemonic:'in',          morse:'..'    },
  { letter:'J', mnemonic:'edgy',        morse:'.---'  },
  { letter:'K', mnemonic:'kit',         morse:'-.-'   },
  { letter:'L', mnemonic:'else',        morse:'.-..'  },
  { letter:'M', mnemonic:'M.A.',        morse:'--'    },
  { letter:'N', mnemonic:'No',          morse:'-.'    },
  { letter:'O', mnemonic:'Opp',         morse:'---'   },
  { letter:'P', mnemonic:'apps',        morse:'.--.'  },
  { letter:'Q', mnemonic:'plaq',        morse:'--.-'  },
  { letter:'R', mnemonic:'rye',         morse:'.-.'   },
  { letter:'S', mnemonic:'sax',         morse:'...'   },
  { letter:'T', mnemonic:'T',           morse:'-'     },
  { letter:'U', mnemonic:'ump',         morse:'..-'   },
  { letter:'V', mnemonic:'veil',        morse:'...-'  },
  { letter:'W', mnemonic:'why',         morse:'.--'   },
  { letter:'X', mnemonic:'foxy',        morse:'-..-'  },
  { letter:'Y', mnemonic:'yell / yolk', morse:'-.--'  },
  { letter:'Z', mnemonic:'Zhou',        morse:'--..'  },
  { letter:'0', mnemonic:'',            morse:'-----' },
  { letter:'1', mnemonic:'',            morse:'.----' },
  { letter:'2', mnemonic:'',            morse:'..---' },
  { letter:'3', mnemonic:'',            morse:'...--' },
  { letter:'4', mnemonic:'',            morse:'....-' },
  { letter:'5', mnemonic:'',            morse:'.....' },
  { letter:'6', mnemonic:'',            morse:'-....' },
  { letter:'7', mnemonic:'',            morse:'--...' },
  { letter:'8', mnemonic:'',            morse:'---..' },
  { letter:'9', mnemonic:'',            morse:'----.' },
];

/* ============================================================
   SOUND SETTINGS
   ============================================================ */
const SPEEDS = {
  fast: { dot: 0.06, dash: 0.18, gap: 0.06 },
  slow: { dot: 0.12, dash: 0.36, gap: 0.12 },
};
const FREQ = 600; /* tone frequency in Hz */

let deck    = [...data];
let idx     = 0;
let flipped = false;
let soundOn = true;
let speed   = 'fast';

const FLIP_DURATION     = 450;
const PAGE_FLIP_DURATION = 700;

/* ============================================================
   CHEAT SHEET
   ============================================================ */
function renderMorseSm(str) {
  return str.split('').map(c => {
    if (c === '.') return '<span class="dot-sm"></span>';
    if (c === '-') return '<span class="dash-sm"></span>';
    return '';
  }).join('');
}

function buildCheatSheet() {
  const letters = data.filter(d => isNaN(d.letter));
  const numbers = data.filter(d => !isNaN(d.letter));

  let html = `
    <thead>
      <tr>
        <th></th>
        <th>Mnemonic</th>
        <th>Morse</th>
      </tr>
    </thead>
    <tbody>
      <tr class="section-divider"><td colspan="3">Letters</td></tr>
  `;

  letters.forEach(d => {
    html += `
      <tr>
        <td>${d.letter}</td>
        <td>${d.mnemonic}</td>
        <td><div class="morse-row-sm">${renderMorseSm(d.morse)}</div></td>
      </tr>
    `;
  });

  html += `<tr class="section-divider"><td colspan="3">Numbers</td></tr>`;

  numbers.forEach(d => {
    html += `
      <tr>
        <td>${d.letter}</td>
        <td></td>
        <td><div class="morse-row-sm">${renderMorseSm(d.morse)}</div></td>
      </tr>
    `;
  });

  html += '</tbody>';
  document.getElementById('cheat-table').innerHTML = html;
}

function toggleCheatSheet() {
  cheatOpen = !cheatOpen;
  document.getElementById('page-inner').classList.toggle('flipped', cheatOpen);
}

/* ============================================================
   FLASHCARD FUNCTIONS
   ============================================================ */
/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Resume context on any tap — satisfies mobile autoplay policy
document.addEventListener('touchstart', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

document.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

function playMorse(morseStr) {
  if (!soundOn) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const { dot, dash, gap } = SPEEDS[speed];
  let t = audioCtx.currentTime + 0.05;
  for (const ch of morseStr) {
    const dur  = ch === '.' ? dot : dash;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = FREQ;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.005);
    gain.gain.setValueAtTime(0.4, t + dur - 0.005);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.start(t);
    osc.stop(t + dur);
    t += dur + gap;
  }
}

function renderMorse(str) {
  return str.split('').map(c => {
    if (c === '.') return '<span class="dot"></span>';
    if (c === '-') return '<span class="dash"></span>';
    return '';
  }).join('');
}

function setCardContent() {
  const d = deck[idx];
  document.getElementById('letter').textContent      = d.letter;
  document.getElementById('mnemonic').textContent    = d.mnemonic;
  document.getElementById('morse-display').innerHTML = renderMorse(d.morse);
  document.getElementById('progress').textContent    = `Card ${idx+1} of ${deck.length}`;
  renderDots();
}

function updateCard() {
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  setCardContent();
}

function navigateTo(newIdx) {
  const card = document.getElementById('card');
  idx = newIdx;
  if (flipped) {
    card.classList.remove('flipped');
    setTimeout(() => { flipped = false; setCardContent(); }, FLIP_DURATION / 2);
  } else {
    setCardContent();
  }
}

function renderDots() {
  const row = document.getElementById('dots-row');
  row.innerHTML = deck.map((_, i) =>
    `<div class="pip${i === idx ? ' active' : ''}" onclick="navigateTo(${i})" title="${deck[i].letter}"></div>`
  ).join('');
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  if (flipped) playMorse(deck[idx].morse);
}

function nextCard() { navigateTo((idx + 1) % deck.length); }
function prevCard() { navigateTo((idx - 1 + deck.length) % deck.length); }

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  navigateTo(0);
}

function reset() { deck = [...data]; navigateTo(0); }

function toggleSpeed() {
  speed = speed === 'fast' ? 'slow' : 'fast';
  document.getElementById('speed-btn').textContent = `speed: ${speed}`;
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundOn ? 'sound: on' : 'sound: off';
  btn.classList.toggle('muted', !soundOn);
}

buildCheatSheet();
updateCard();
</script>
</body>
</html>
